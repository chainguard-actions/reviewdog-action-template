name: Test fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with fail_level=none (should always succeed even with findings)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
      - name: Assert action exited 0 with fail_level=none despite misspellings
        run: |
          echo "Action completed with exit code 0 as expected (fail_level=none)"
          echo "PASS"
