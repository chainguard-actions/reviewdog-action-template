name: Test reviewdog_flags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with additional reviewdog flags (-tee prints to stdout)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          reviewdog_flags: '-tee'
      - name: Assert action completed with reviewdog_flags
        run: |
          echo "Action completed with reviewdog_flags=-tee"
          echo "PASS"
