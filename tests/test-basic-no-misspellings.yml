name: Test basic usage - no misspellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully with no misspellings"
