name: Test custom workdir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: testdata
          level: error
          reporter: local
          filter_mode: nofilter
          fail_level: none
          locale: US
      - name: Assert action completed with custom workdir
        run: |
          echo "Action completed successfully using custom workdir (testdata)"
          echo "PASS"
