name: Test locale input (US/UK)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file with UK spelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/testdata/locale"
          echo "The colour of the organisation is blue." > "$GITHUB_WORKSPACE/testdata/locale/uk.txt"
      - id: action-us-locale
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/locale
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info
          locale: US
      - name: Assert action completed with US locale
        run: |
          echo "Action completed with US locale"
          echo "PASS"
