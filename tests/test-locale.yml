name: Test locale input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with UK locale (colour is correct in UK English)
        id: action-uk
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
          locale: UK
      - name: Assert action completed with UK locale
        run: |
          echo "Action completed with locale=UK"
          echo "PASS"
