name: Test locale input - US locale flags British spellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/locale-us
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          locale: US
      - name: Assert action succeeded with US locale
        run: |
          echo "PASS: action completed with US locale (British spelling flagged but fail_level=none)"
