name: Test locale flag - UK locale accepts British spelling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with British spelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/locale-uk"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/locale-uk/text.md" <<'EOF'
          The colour of the sky is blue.
          The flavour of the food is great.
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action-uk
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/locale-uk
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          locale: UK

      - name: Assert UK locale action succeeded (British spelling accepted)
        run: |
          echo "PASS: action ran with UK locale without error"

      - id: action-us
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/locale-uk
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error
          locale: US

      - name: Assert US locale action also ran (may flag British spellings but fail_level=none)
        run: |
          echo "PASS: action ran with US locale without error (fail_level=none)"
