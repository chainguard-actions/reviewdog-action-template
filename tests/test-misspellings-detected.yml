name: Test misspellings detected - fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # tests/fixtures/misspelled/text.md contains intentional misspellings:
      # "Determinisitic", "langauge", "colour"
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/misspelled
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning

      - name: Assert action completed (fail_level=none means exit 0 even with findings)
        run: |
          echo "Action completed successfully with fail_level=none"
          echo "PASS"
