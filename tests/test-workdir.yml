name: Test workdir input - run in testdata directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: testdata
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
      - name: Assert action succeeded
        run: |
          echo "PASS: action completed with workdir set to testdata (misspellings reported but fail_level=none)"
