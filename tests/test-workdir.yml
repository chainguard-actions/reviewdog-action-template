name: Test workdir input - action runs in specified subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create nested subdirectory with clean content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/workdir-test/subdir"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/workdir-test/subdir/clean.md" <<'EOF'
          This file has correct spelling in the subdirectory.
          The project is working correctly.
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/workdir-test/subdir
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action ran in specified workdir without error
        run: |
          echo "PASS: action correctly ran in the specified workdir"
