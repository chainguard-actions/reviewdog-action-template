name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with workdir pointing to subdirectory
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/subdir
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info
      - name: Assert action completed successfully with workdir
        run: |
          echo "Action completed with workdir=tests/fixtures/subdir"
          echo "PASS"
