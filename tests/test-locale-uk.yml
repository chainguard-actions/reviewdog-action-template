name: Test locale UK - colour is not a misspelling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/uk-spelling
          locale: UK
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action succeeded with UK locale
        run: |
          echo "PASS: action completed with locale=UK, 'colour' is not flagged as misspelling"
