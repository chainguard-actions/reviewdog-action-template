name: Test fail_level - action fails when misspellings found at error level
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/misspelled
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
        continue-on-error: true
      - name: Assert action failed due to misspellings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when misspellings found with fail_level=error, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when misspellings were found"
