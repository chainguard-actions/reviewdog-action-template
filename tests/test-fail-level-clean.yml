name: Test fail_level with clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          level: error
          reporter: local
          filter_mode: nofilter
          fail_level: error
          locale: US
      - name: Assert action passed with no misspellings
        run: |
          echo "Action completed successfully - no misspellings found in clean fixtures directory"
          echo "PASS"
