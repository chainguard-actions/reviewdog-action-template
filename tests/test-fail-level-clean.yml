name: Test fail level with clean content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with fail_level=error on clean content (no misspellings)
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
      - name: Assert action completed successfully (no misspellings found)
        run: |
          echo "Action completed successfully with fail_level=error on clean content"
          echo "PASS"
