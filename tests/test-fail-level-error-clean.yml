name: Test fail_level error - clean directory exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # With fail_level=error and no misspellings, reviewdog exits 0
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean-text
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action exited 0 with no spelling errors found
        run: |
          echo "Action exited 0 as expected - no spelling errors in clean directory"
          echo "PASS"
