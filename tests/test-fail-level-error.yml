name: Test fail_level=error causes failure on misspellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file with misspellings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/testdata/fail-level"
          echo "This is a teh misspelled file with errror." > "$GITHUB_WORKSPACE/testdata/fail-level/bad.txt"
      - id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata/fail-level
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
        continue-on-error: true
      - name: Assert action failed due to misspellings with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and misspellings present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when misspellings found with fail_level=error"
