name: Test fail_level error - exits 1 when misspellings found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/misspellings
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action failed due to misspellings with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fail_level=error and misspellings present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly exited with failure when misspellings found and fail_level=error"
