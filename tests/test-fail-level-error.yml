name: Test fail_level=error causes failure when misspellings found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with misspellings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/fail-level"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/fail-level/text.md" <<'EOF'
          Determinisitic result is important.
          langauge is a common misspelling.
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/fail-level
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action failed due to misspellings with fail_level=error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when misspellings found with fail_level=error"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reviewdog may have filtered all findings in this context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
