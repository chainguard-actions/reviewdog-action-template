name: Test basic usage - no spelling errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no errors (exit 0)"
          echo "PASS"
