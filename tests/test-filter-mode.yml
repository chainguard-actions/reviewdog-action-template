name: Test filter mode nofilter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with filter_mode=nofilter and reporter=local
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
      - name: Assert action completed successfully with nofilter mode
        run: |
          echo "Action completed successfully with filter_mode=nofilter"
          echo "PASS"
