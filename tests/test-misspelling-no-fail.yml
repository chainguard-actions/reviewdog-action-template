name: Test misspelling found but fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test file with misspelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/testfiles-misspell"
          echo "This is a teh misspelled file." > "$GITHUB_WORKSPACE/testfiles-misspell/bad.txt"
      - id: action
        uses: .
        with:
          github_token: 'dummy-token'
          workdir: 'testfiles-misspell'
          reporter: 'local'
          filter_mode: 'nofilter'
          fail_level: 'none'
          level: 'error'
      - name: Assert action completed without failure despite misspelling
        run: |
          echo "Action completed without failure (fail_level=none)"
          echo "PASS"
