name: Test US locale
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with US locale on testdata (has UK spellings like 'colour')
        id: action
        uses: .
        with:
          github_token: dummy-token
          workdir: testdata
          locale: US
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info
      - name: Assert action completed successfully with US locale
        run: |
          echo "Action completed successfully with US locale (fail_level=none)"
          echo "PASS"
