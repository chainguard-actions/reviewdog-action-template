name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workdir: tests/fixtures/clean
          level: error
          reporter: local
          filter_mode: nofilter
          fail_level: none
          locale: US
      - name: Assert action completed successfully
        run: |
          echo "Action completed with exit code 0 (fail_level=none always exits 0)"
          echo "PASS"
